name: daily-feed
on:
  schedule:
    - cron: "15 4 * * *"
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  build-feed:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run pipeline
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ESPP_CSV_URL: ${{ secrets.ESPP_CSV_URL }}
          FEED_OUT: site/feed.json
        run: |
          mkdir -p site
          python pipeline.py
      - name: Save the fresh feed
        run: |
          git config user.name "public-denar-bot"
          git config user.email "bot@users.noreply.github.com"
          git add site/feed.json
          git diff --cached --quiet || git commit -m "daily feed update"
          git push
